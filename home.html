
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Image Editor</title>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 3px 15px #0001;
    }

    h1 {
        color: #1565c0;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 18px;
        font-weight: bold;
    }

    input, select, button {
        box-sizing: border-box;
        width: 100%;
        margin-top: 8px;
        padding: 11px;
        font-size: 16px;
    }

    button {
        background: #1565c0;
        color: white;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
    }

    button:disabled {
        background: #999;
    }

    iframe {
        width: 100%;
        height: 350px;
        margin-top: 15px;
        border: 1px solid #ddd;
    }

    #imagePreview {
        display: none;
        max-width: 100%;
        max-height: 180px;
        margin: 15px auto;
    }

    #imageStep, #editStep {
        display: none;
    }

    #status {
        overflow-wrap: anywhere;
        margin-top: 15px;
    }
</style>
</head>

<body>
<div class="container">
    <h1>PDF Image Editor</h1>
    <p>Select a PDF, add a JPG image, choose its position and size, and download your edited PDF.</p>

    <label for="pdfFile">Step 1: Select your PDF</label>
    <input type="file" id="pdfFile" accept=".pdf,application/pdf">

    <iframe id="pdfPreview" title="PDF preview" hidden></iframe>

    <div id="imageStep">
        <label for="jpgFile">Step 2: Select your JPG image</label>
        <input type="file" id="jpgFile" accept=".jpg,.jpeg,image/jpeg">
        <img id="imagePreview" alt="Selected JPG preview">
    </div>

    <div id="editStep">
        <label for="pageNumber">Step 3: Choose PDF page</label>
        <input type="number" id="pageNumber" min="1" value="1">

        <label for="position">Step 4: Choose image position</label>
        <select id="position">
            <option value="top-left">Top left</option>
            <option value="top-center">Top center</option>
            <option value="top-right">Top right</option>
            <option value="center-left">Center left</option>
            <option value="center" selected>Center</option>
            <option value="center-right">Center right</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-center">Bottom center</option>
            <option value="bottom-right">Bottom right</option>
        </select>

        <label for="imageWidth">Step 5: Image width (mm)</label>
        <input type="number" id="imageWidth" min="1" max="500"
               value="40" step="1">

        <label for="imageHeight">Image height (mm)</label>
        <input type="number" id="imageHeight" min="1" max="500"
               value="40" step="1">

        <button id="downloadBtn" disabled>
            Add Image & Download PDF
        </button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
</div>

<script>
const pdfInput = document.getElementById("pdfFile");
const jpgInput = document.getElementById("jpgFile");
const imageStep = document.getElementById("imageStep");
const editStep = document.getElementById("editStep");
const preview = document.getElementById("pdfPreview");
const imagePreview = document.getElementById("imagePreview");
const downloadBtn = document.getElementById("downloadBtn");
const status = document.getElementById("status");

let pdfBytes = null;
let pdfUrl = null;
let imageBytes = null;

pdfInput.addEventListener("change", async () => {
    const file = pdfInput.files[0];
    if (!file) return;

    resetImage();
    pdfBytes = null;

    if (file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")) {
        status.textContent = "Please select a PDF file.";
        imageStep.style.display = "none";
        return;
    }

    try {
        pdfBytes = await file.arrayBuffer();

        // Validate the PDF before asking for an image.
        const doc = await PDFLib.PDFDocument.load(pdfBytes.slice(0));
        document.getElementById("pageNumber").max =
            doc.getPageCount();

        if (pdfUrl) URL.revokeObjectURL(pdfUrl);
        pdfUrl = URL.createObjectURL(file);
        preview.src = pdfUrl;
        preview.hidden = false;

        imageStep.style.display = "block";
        status.textContent =
            "PDF selected (" + doc.getPageCount() +
            " pages). Now select your JPG image.";
    } catch (error) {
        pdfBytes = null;
        preview.hidden = true;
        imageStep.style.display = "none";
        status.textContent =
            "Unable to read this PDF. Please select a valid, unencrypted PDF.";
    }
});

jpgInput.addEventListener("change", async () => {
    const file = jpgInput.files[0];
    imageBytes = null;
    editStep.style.display = "none";
    downloadBtn.disabled = true;

    if (!file) return;

    if (!["image/jpeg"].includes(file.type) &&
        !/\.(jpg|jpeg)$/i.test(file.name)) {
        status.textContent = "Please select a JPG or JPEG image.";
        return;
    }

    try {
        imageBytes = await file.arrayBuffer();

        // Check that the selected file is a valid JPEG.
        await createImageBitmap(file).then(img => img.close());

        imagePreview.src = URL.createObjectURL(file);
        imagePreview.style.display = "block";
        editStep.style.display = "block";
        downloadBtn.disabled = false;
        status.textContent =
            "Image selected. Choose its page, position and size.";
    } catch (error) {
        imageBytes = null;
        status.textContent = "Unable to read this image. Try another JPG.";
    }
});

function resetImage() {
    jpgInput.value = "";
    imageBytes = null;
    editStep.style.display = "none";
    imageStep.style.display = "none";
    imagePreview.style.display = "none";
    downloadBtn.disabled = true;
}

downloadBtn.addEventListener("click", async () => {
    if (!pdfBytes || !imageBytes) {
        status.textContent = "Select both files first.";
        return;
    }

    downloadBtn.disabled = true;
    status.textContent = "Processing PDF...";

    try {
        const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes.slice(0));
        const pages = pdfDoc.getPages();
        const pageNum = Number(
            document.getElementById("pageNumber").value
        );

        if (!Number.isInteger(pageNum) ||
            pageNum < 1 || pageNum > pages.length) {
            throw new Error("Choose a valid PDF page number.");
        }

        const page = pages[pageNum - 1];
        const pageWidth = page.getWidth();
        const pageHeight = page.getHeight();

        // Convert millimetres to PDF points.
        const width = Number(
            document.getElementById("imageWidth").value
        ) * 72 / 25.4;

        const height = Number(
            document.getElementById("imageHeight").value
        ) * 72 / 25.4;

        if (!Number.isFinite(width) || !Number.isFinite(height) ||
            width <= 0 || height <= 0 ||
            width > pageWidth || height > pageHeight) {
            throw new Error(
                "Image dimensions must fit inside the selected PDF page."
            );
        }

        const jpg = await pdfDoc.embedJpg(imageBytes);
        const position = document.getElementById("position").value;

        let x, y;

        if (position.endsWith("left")) x = 0;
        else if (position.endsWith("right")) x = pageWidth - width;
        else x = (pageWidth - width) / 2;

        if (position.startsWith("top")) y = pageHeight - height;
        else if (position.startsWith("bottom")) y = 0;
        else y = (pageHeight - height) / 2;

        page.drawImage(jpg, {
            x, y, width, height
        });

        const output = await pdfDoc.save();
        const blob = new Blob([output], {
            type: "application/pdf"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "edited-document.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 60000);
        status.textContent =
            "PDF created! Check your Downloads folder.";
    } catch (error) {
        status.textContent = error.message ||
            "Something went wrong. Please try again.";
    } finally {
        downloadBtn.disabled = false;
    }
});
</script>
</body>
</html>
